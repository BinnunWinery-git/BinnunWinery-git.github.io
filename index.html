<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>לומדים את בן נון</title>
<meta name="theme-color" content="#7A1F3D">
<meta name="description" content="היינות, הענבים והסיפור של יקב בן נון: כרטיסיות וחידונים לצוות">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="בן נון">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=Assistant:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9ECE4; --surface:#FBFBF8; --ink:#221A26; --muted:#5E5863; --wine:#7A1F3D;
  --oak:#9A6B3F; --ok:#3F6B3A; --bad:#A3322A; --line:#D3D6CC; --label:#F6F1E4;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#17131A; --surface:#221C26; --ink:#EEE9EF; --muted:#A79FAA; --wine:#D0708F;
    --oak:#C9A071; --ok:#8DBB7F; --bad:#E0796F; --line:#3A3240; --label:#2B2330;
  }
}
:root[data-theme="dark"]{
  --bg:#17131A; --surface:#221C26; --ink:#EEE9EF; --muted:#A79FAA; --wine:#D0708F;
  --oak:#C9A071; --ok:#8DBB7F; --bad:#E0796F; --line:#3A3240; --label:#2B2330;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Assistant",system-ui,"Segoe UI",Arial,sans-serif;font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:580px;margin:0 auto;padding:20px 16px 48px}
header h1{font-family:"Frank Ruhl Libre","David",serif;font-weight:900;font-size:34px;line-height:1.1;margin:8px 0 4px;color:var(--wine)}
header p{margin:0;color:var(--muted)}
nav{display:flex;gap:4px;margin:20px 0 18px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
nav button{flex:1;border:0;background:transparent;color:var(--muted);font:600 16px "Assistant",sans-serif;padding:10px 4px;border-radius:10px;cursor:pointer}
nav button[aria-selected="true"]{background:var(--wine);color:#fff}
button:focus-visible,.card:focus-visible,select:focus-visible{outline:3px solid var(--oak);outline-offset:2px}
.hidden{display:none!important}
h2.sec{font-family:"Frank Ruhl Libre",serif;font-size:24px;margin:0 0 4px}
.lead{color:var(--muted);margin:0 0 14px}

.filter{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:5px 12px;font:600 14px "Assistant",sans-serif;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--wine);color:var(--wine)}
.meta{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:15px;margin-bottom:10px}

/* flashcard styled as a bottle label */
.scene{perspective:1400px}
.card{position:relative;min-height:520px;cursor:pointer;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:6px;overflow:auto}
.front{background:var(--label);border:1px solid var(--oak);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 22px 44px}
.front::before{content:"";position:absolute;inset:8px;border:1px solid var(--oak);border-radius:3px;pointer-events:none;opacity:.6}
.bottle{height:210px;display:flex;align-items:flex-end;justify-content:center;margin-bottom:8px}
.bottle img{max-height:210px;max-width:160px;object-fit:contain}
.bottle svg{height:190px;width:auto}
.front .name{font-family:"Frank Ruhl Libre",serif;font-weight:900;font-size:clamp(34px,9vw,48px);line-height:1.05;margin:8px 0 4px;direction:ltr}
.front .he{font-family:"Frank Ruhl Libre",serif;font-size:19px;color:var(--muted)}
.front .vint{font-family:"Frank Ruhl Libre",serif;font-size:24px;font-weight:700;color:var(--wine);margin-top:8px}
.front .series{margin-top:2px;color:var(--muted)}
.front .hint{position:absolute;bottom:20px;font-size:14px;color:var(--muted)}
.back{background:var(--surface);border:1px solid var(--line);transform:rotateY(180deg);padding:20px 20px 24px}
.back h3{font-family:"Frank Ruhl Libre",serif;margin:0 0 12px;font-size:25px;direction:ltr;text-align:right}
.blend{display:flex;height:22px;border-radius:4px;overflow:hidden;border:1px solid var(--line);margin:4px 0 8px}
.blend span{display:block;height:100%}
.legend{list-style:none;padding:0;margin:0 0 14px;display:grid;grid-template-columns:1fr 1fr;gap:3px 12px;font-size:15px}
.legend li{display:flex;align-items:center;gap:6px}
.legend i{width:11px;height:11px;border-radius:2px;flex:none;outline:1px solid var(--line)}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:16px}
dt{color:var(--muted)}
dd{margin:0}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:1px 9px;font-size:14.5px}
.tip{margin-top:14px;padding:10px 12px;border-right:3px solid var(--wine);background:var(--bg);border-radius:4px;font-size:15.5px}
.row{display:flex;gap:10px;margin-top:14px}
.btn{flex:1;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 16px "Assistant",sans-serif;padding:13px 10px;border-radius:12px;cursor:pointer}
.btn.primary{background:var(--wine);border-color:var(--wine);color:#fff}
.btn.good{border-color:var(--ok);color:var(--ok)}
.btn.soft{border-color:var(--bad);color:var(--bad)}
.progress{height:4px;background:var(--line);border-radius:2px;margin-top:16px;overflow:hidden}
.progress b{display:block;height:100%;background:var(--ok);transition:width .3s}
.small{font-size:14px;color:var(--muted);text-align:center;margin-top:8px}

/* wine catalog */
.seg{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:14px}
.seg button{flex:1;border:0;background:transparent;color:var(--muted);font:600 15px "Assistant",sans-serif;padding:8px 4px;border-radius:9px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.sortbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
.sortbar .lbl{color:var(--muted);font-size:14px;margin-left:2px}
.sortnote{font-size:13.5px;color:var(--muted);margin:2px 0 10px;min-height:1em}
.grp{font-family:"Frank Ruhl Libre",serif;font-size:19px;font-weight:700;color:var(--wine);margin:18px 2px 8px;display:flex;justify-content:space-between;align-items:baseline}
.grp small{font-family:"Assistant",sans-serif;font-size:14px;color:var(--muted);font-weight:400}
.wrow{display:flex;align-items:center;gap:12px;width:100%;text-align:right;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-bottom:8px;cursor:pointer;color:var(--ink);font:inherit}
.wrow:active{transform:scale(.99)}
.wrow .thumb{width:40px;height:76px;flex:none;display:flex;align-items:center;justify-content:center}
.wrow .thumb img{max-height:76px;max-width:40px;object-fit:contain}
.wrow .thumb svg{height:70px;width:auto}
.wrow .wmain{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.wrow .wname{font-family:"Frank Ruhl Libre",serif;font-weight:700;font-size:19px;line-height:1.15;direction:ltr;text-align:right}
.wrow .wsub{font-size:14px;color:var(--muted)}
.wrow .wgr{font-size:13.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wrow .wmet{flex:none;text-align:left;font-family:"Frank Ruhl Libre",serif;font-weight:700;color:var(--wine);font-size:17px;line-height:1.2}
.wrow .wmet small{display:block;font-family:"Assistant",sans-serif;font-weight:400;font-size:12.5px;color:var(--muted)}
.meter{display:inline-flex;gap:3px;direction:rtl}
.meter i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--line);vertical-align:middle}
.meter i.on{background:var(--wine)}
.back-link{all:unset;cursor:pointer;color:var(--wine);font-weight:700;font-size:16px;display:inline-flex;align-items:center;gap:6px;padding:6px 0;margin-bottom:8px}
.back-link:focus-visible{outline:2px solid var(--oak);outline-offset:3px;border-radius:4px}
.dhero{display:grid;grid-template-columns:110px 1fr;gap:16px;align-items:center;background:var(--label);border:1px solid var(--oak);border-radius:8px;padding:16px;margin-bottom:14px}
.dhero .dimg{display:flex;justify-content:center}
.dhero .dimg img{max-height:230px;max-width:100px;object-fit:contain}
.dhero .dimg svg{height:200px;width:auto}
.dhero h2{font-family:"Frank Ruhl Libre",serif;font-weight:900;font-size:clamp(28px,8vw,40px);line-height:1.05;margin:0;direction:ltr;text-align:right}
.dhero .dhe{font-family:"Frank Ruhl Libre",serif;color:var(--muted);font-size:17px}
.dhero .dvint{font-family:"Frank Ruhl Libre",serif;font-weight:700;color:var(--wine);font-size:22px;margin-top:6px}
.dhero .dser{color:var(--muted);font-size:15px}
.dhero .dprice{font-family:"Frank Ruhl Libre",serif;font-weight:700;font-size:22px;margin-top:8px}
.facts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:14px}
.fact2{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.fact2 span{display:block;font-size:13px;color:var(--muted)}
.fact2 b{font-size:16px}
.dsec{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.dsec h3{font-family:"Frank Ruhl Libre",serif;font-size:18px;margin:0 0 8px;color:var(--wine)}

/* grape buttons inside a wine card + grape sheet */
.legend .gbtn{all:unset;display:flex;align-items:center;gap:6px;cursor:pointer;border-bottom:1px dashed var(--muted);padding:1px 0}
.legend .gbtn:focus-visible{outline:2px solid var(--oak);outline-offset:2px}
.gnote{font-size:13.5px;color:var(--muted);margin:-8px 0 12px}
dialog.sheet{border:0;padding:0;margin:auto auto 0;width:100%;max-width:580px;max-height:85vh;border-radius:18px 18px 0 0;background:var(--surface);color:var(--ink)}
dialog.sheet::backdrop{background:rgba(20,10,20,.45)}
.sheet .inner{padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));overflow:auto;max-height:85vh}
.sheet .shead{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.sheet .shead .gname{font-family:"Frank Ruhl Libre",serif;font-size:24px;font-weight:700;line-height:1.1}
.sheet .shead .gsub{font-size:14.5px;color:var(--muted)}
.sheet p{margin:0 0 10px}
@media (min-width:640px){dialog.sheet{margin:auto;border-radius:18px}}

/* grapes */
.grape{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
.grape summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;align-items:center;gap:12px}
.grape summary::-webkit-details-marker{display:none}
.dot{width:26px;height:26px;border-radius:50%;flex:none;box-shadow:inset -4px -4px 0 rgba(0,0,0,.18)}
.grape .gname{font-family:"Frank Ruhl Libre",serif;font-size:21px;font-weight:700;line-height:1.1}
.grape .gsub{font-size:14.5px;color:var(--muted)}
.grape .gbody{padding:0 16px 16px}
.grape .gbody p{margin:0 0 10px}
.grape[open] summary{border-bottom:1px solid var(--line);margin-bottom:12px}

/* quiz */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 20px}
.modes{display:grid;gap:10px}
.mode{text-align:right;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;padding:14px 16px;cursor:pointer;font:16px "Assistant",sans-serif}
.mode b{display:block;font-family:"Frank Ruhl Libre",serif;font-size:20px;margin-bottom:2px}
.mode span{color:var(--muted);font-size:15px}
select{width:100%;margin-top:10px;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:16px "Assistant",sans-serif}
.qnum{color:var(--muted);font-size:15px;display:flex;justify-content:space-between}
.qimg{display:flex;justify-content:center;margin:10px 0 0}
.qimg img{max-height:130px}
.qimg svg{height:120px;width:auto}
.qtext{font-family:"Frank Ruhl Libre",serif;font-size:22px;font-weight:700;line-height:1.3;margin:10px 0 16px}
.opts{display:grid;gap:8px}
.opt{text-align:right;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:16.5px "Assistant",sans-serif;padding:13px 14px;border-radius:10px;cursor:pointer}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--surface));font-weight:700}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.opt:disabled{cursor:default}
.explain{margin-top:14px;font-size:15.5px;color:var(--muted)}
.score{font-family:"Frank Ruhl Libre",serif;font-size:64px;font-weight:900;color:var(--wine);text-align:center;line-height:1;margin:6px 0}
.review{margin-top:16px;font-size:15px}
.review li{margin-bottom:6px}

/* story */
.fact{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:10px}
.fact h3{font-family:"Frank Ruhl Libre",serif;margin:0 0 4px;font-size:21px;color:var(--wine)}
.fact p{margin:0}
.timeline{list-style:none;padding:0;margin:12px 0 0;border-right:2px solid var(--oak)}
.timeline li{position:relative;padding:0 18px 12px 0}
.timeline li::before{content:"";position:absolute;right:-7px;top:7px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--oak)}
.timeline b{font-family:"Frank Ruhl Libre",serif;font-size:19px;color:var(--wine);margin-left:6px}
@media (prefers-reduced-motion: reduce){.card{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>לומדים את בן נון</h1>
    <p>הבקבוקים, הענבים והסיפור של היקב. לומדים, מתרגלים ונבחנים.</p>
  </header>

  <nav role="tablist">
    <button role="tab" aria-selected="true" data-view="wines">יינות</button>
    <button role="tab" aria-selected="false" data-view="grapes">ענבים</button>
    <button role="tab" aria-selected="false" data-view="quiz">חידון</button>
    <button role="tab" aria-selected="false" data-view="story">הסיפור</button>
  </nav>

  <!-- WINES -->
  <section id="wines">
    <div class="seg" id="wineMode">
      <button data-mode="list" aria-pressed="true">כל היינות</button>
      <button data-mode="cards" aria-pressed="false">תרגול כרטיסיות</button>
    </div>

    <div id="wineList">
      <div class="sortbar" id="sortbar"><span class="lbl">סידור לפי:</span></div>
      <p class="sortnote" id="sortnote"></p>
      <div id="rows"></div>
    </div>

    <div id="wineDetail" class="hidden"></div>

    <div id="wineCards" class="hidden">
    <div class="filter" id="filter"></div>
    <div class="meta"><span id="cardPos"></span><span id="knownCount"></span></div>
    <div class="scene">
      <div class="card" id="card" tabindex="0" role="button" aria-label="הפיכת הכרטיס">
        <div class="face front" id="front"></div>
        <div class="face back" id="back"></div>
      </div>
    </div>
    <div class="row">
      <button class="btn soft" id="again">עוד לא</button>
      <button class="btn good" id="know">ידעתי</button>
    </div>
    <div class="row">
      <button class="btn" id="prev">הקודם</button>
      <button class="btn" id="shuffle">ערבוב</button>
      <button class="btn" id="next">הבא</button>
    </div>
    <div class="row"><button class="btn primary" id="quizThis">חידון על הבקבוק הזה</button></div>
    <div class="progress"><b id="bar"></b></div>
    <p class="small">הקישו על הכרטיס כדי להפוך אותו</p>
    </div>
  </section>

  <!-- GRAPES -->
  <section id="grapes" class="hidden">
    <h2 class="sec">הענבים של בן נון</h2>
    <p class="lead">12 זנים ביינות של היקב. פתחו כל זן כדי לראות מאיפה הוא מגיע, מה מרגישים בו, ובאילו בקבוקים הוא נמצא.</p>
    <div id="grapeList"></div>
    <div class="row"><button class="btn primary" id="quizGrapes">חידון ענבים</button></div>
  </section>

  <!-- QUIZ -->
  <section id="quiz" class="hidden">
    <div class="panel" id="quizBox"></div>
  </section>

  <!-- STORY -->
  <section id="story" class="hidden"></section>
</div>

<dialog class="sheet" id="gdlg" aria-labelledby="gdlgTitle"><div class="inner" id="gdlgBody"></div></dialog>

/* ---------- wine flashcards ---------- */
const FILTERS=[["all","הכול"],["light","לבנים ורוזה"],["Reserve","Reserve"],["Barrel Reserve","Barrel Reserve"],["top","יין המלכים ומגנום"],["new","חדשים"],["todo","עוד לא ידעתי"]];
let filter="all", deck=[], pos=0;
let known=new Set(store.get("bn-known",[]));
function matches(w){
  if(filter==="all") return true;
  if(filter==="light") return w.kind==="לבן"||w.kind==="רוזה";
  if(filter==="top") return w.series==="Kings Wine"||w.series==="Magnum";
  if(filter==="new") return w.price===null;
  if(filter==="todo") return !known.has(w.id);
  return w.series===filter;
}
function buildFilter(){
  const el=$("filter"); el.innerHTML="";
  FILTERS.forEach(([k,t])=>{const c=document.createElement("button");c.className="chip";c.textContent=t;c.setAttribute("aria-pressed",filter===k);c.onclick=()=>{filter=k;buildDeck(false);buildFilter();};el.appendChild(c);});
}
function buildDeck(mix){deck=WINES.filter(matches); if(mix) deck=shuffle(deck); pos=0; render();}
function render(){
  $("card").classList.remove("flipped");
  const n=WINES.filter(w=>known.has(w.id)).length;
  $("knownCount").textContent=`ידעתי ${n} מתוך ${WINES.length}`;
  $("bar").style.width=(n/WINES.length*100)+"%";
  $("quizThis").disabled=!deck.length;
  if(!deck.length){$("cardPos").textContent="";$("front").innerHTML=`<div class="he">כל הכרטיסים בקבוצה הזו סומנו כ"ידעתי".</div><div class="hint">בחרו קבוצה אחרת למעלה</div>`;$("back").innerHTML="";return;}
  const w=deck[pos];
  $("cardPos").textContent=`כרטיס ${pos+1} מתוך ${deck.length}`;
  $("front").innerHTML=`<div class="bottle">${bottle(w)}</div>
    <div class="name">${w.name}</div>${w.he?`<div class="he">${w.he}</div>`:""}
    <div class="vint">${w.vintage}</div>
    <div class="series">${w.series||"סדרה לא צוינה"} · ${w.kind}</div>
    <div class="hint">מה יש בבקבוק? הקישו להפוך</div>`;
  const legend=`<div class="blend" aria-hidden="true">${w.blend.map(([g,p])=>`<span style="width:${p}%;background:${GRAPE_COLORS[g]||"#888"}"></span>`).join("")}</div>
    <ul class="legend">${w.blend.map(([g,p])=>`<li><button class="gbtn" data-g="${g}" aria-label="מה זה ${g}?"><i style="background:${GRAPE_COLORS[g]||"#888"}"></i>${p}% ${g}</button></li>`).join("")}</ul>
    <p class="gnote">הקישו על זן כדי לקרוא עליו</p>`;
  const tastes=w.tastes.length?`<div class="tags">${w.tastes.map(t=>`<span class="tag">${t}</span>`).join("")}</div>`:(w.texture||"לא פורט");
  $("back").innerHTML=`<h3>${w.name} ${w.vintage}</h3>${legend}
    <dl>
      <dt>חבית</dt><dd>${w.barrel||"לא צוין"}</dd>
      <dt>טעמים</dt><dd>${tastes}</dd>
      ${w.alc?`<dt>אלכוהול</dt><dd>${w.alc}</dd>`:""}
      ${w.serve?`<dt>הגשה</dt><dd>${w.serve}</dd>`:""}
      ${w.awards?`<dt>פרסים</dt><dd>${w.awards}</dd>`:""}
      <dt>מחיר</dt><dd>${priceText(w)}</dd>
    </dl>
    <div class="tip">${w.tip}${w.v?" (אומת מול התווית)":""}</div>`;
}
function flip(){$("card").classList.toggle("flipped")}
$("card").addEventListener("click",flip);
$("card").addEventListener("keydown",e=>{if(e.target!==$("card"))return;if(e.key===" "||e.key==="Enter"){e.preventDefault();flip();}});
$("back").addEventListener("click",e=>{const b=e.target.closest(".gbtn");if(b){e.stopPropagation();openGrape(b.dataset.g);}});
function step(d){if(!deck.length)return;pos=(pos+d+deck.length)%deck.length;render();}
$("next").onclick=()=>step(1); $("prev").onclick=()=>step(-1); $("shuffle").onclick=()=>buildDeck(true);
$("know").onclick=()=>{if(!deck.length)return;known.add(deck[pos].id);store.set("bn-known",[...known]);if(filter==="todo"){deck.splice(pos,1);if(pos>=deck.length)pos=0;render();}else step(1);};
$("again").onclick=()=>{if(!deck.length)return;known.delete(deck[pos].id);store.set("bn-known",[...known]);step(1);};

/* ---------- wine catalog ---------- */
const KIND_ORDER={"לבן":0,"רוזה":1,"אדום":2,"קינוח":3};
const KIND_GROUP=["לבנים","רוזה","אדומים","קינוח"];
const priceNum=w=>typeof w.price==="number"?w.price:Infinity;
const ageText=w=>w.age===0?(w.barrel||"לא צוין"):w.age===1?"במכלים, 10–12 ח׳":w.age===99?"בחבית, משך לא צוין":w.age+" חודשים";
const meter=n=>`<span class="meter" aria-label="${BODY_LABEL[n]}">${[1,2,3,4,5].map(i=>`<i class="${i<=n?"on":""}"></i>`).join("")}</span>`;
const SORTS={
  price:{label:"מחיר",note:"מהזול ליקר. יינות בלי מחיר ידוע בסוף.",
    key:w=>[priceNum(w)],
    group:w=>w.price==null?"מחיר עוד לא ידוע":w.price<110?"עד 110 ₪":w.price<=170?"110–170 ₪":"מעל 170 ₪",
    metric:w=>w.price!=null?`${w.price} ₪`:`<small>מחיר</small>לא ידוע`},
  color:{label:"לבן ← אדום",note:"לבנים, רוזה, אדומים וקינוח. בתוך כל קבוצה מהקליל לעשיר.",
    key:w=>[KIND_ORDER[w.kind],w.body,priceNum(w)],
    group:w=>KIND_GROUP[KIND_ORDER[w.kind]],
    metric:w=>w.price!=null?`${w.price} ₪`:`<small>מחיר</small>לא ידוע`},
  body:{label:"עומק הטעם",note:"מהקליל לעשיר. הדירוג משוער, לפי תיאורי התוויות והאתר.",
    key:w=>[w.body===0?9:w.body,priceNum(w)],
    group:w=>BODY_LABEL[w.body],
    metric:w=>w.body?`${meter(w.body)}<small>${BODY_LABEL[w.body]}</small>`:`<small>יין קינוח</small>מתוק`},
  age:{label:"זמן יישון",note:"מהקצר לארוך. \"בחבית, משך לא צוין\" בסוף.",
    key:w=>[w.age,priceNum(w)],
    group:w=>w.age===0?"לא צוין יישון בחבית":w.age===1?"התיישן במכלים":w.age===99?"בחבית, משך לא צוין":w.age+" חודשים בחבית",
    metric:w=>w.age>1&&w.age<99?`${w.age}<small>חודשים</small>`:`<small>${w.age===1?"מכלים":w.age===99?"חבית":"חבית"}</small>${w.age===1?"10–12 ח׳":"לא צוין"}`}
};
let sortBy=store.get("bn-sort","color"), sortRev=store.get("bn-sortrev",false), listOrder=[];
function cmp(a,b){for(let i=0;i<a.length;i++){if(a[i]!==b[i])return a[i]<b[i]?-1:1;}return 0;}
function buildSortbar(){
  const bar=$("sortbar"); bar.querySelectorAll("button").forEach(b=>b.remove());
  Object.entries(SORTS).forEach(([k,v])=>{const c=document.createElement("button");c.className="chip";c.textContent=v.label;c.setAttribute("aria-pressed",sortBy===k);c.onclick=()=>{sortBy=k;sortRev=false;store.set("bn-sort",k);store.set("bn-sortrev",false);buildSortbar();renderList();};bar.appendChild(c);});
  const r=document.createElement("button");r.className="chip";r.textContent="⇅ הפוך סדר";r.setAttribute("aria-pressed",sortRev);
  r.onclick=()=>{sortRev=!sortRev;store.set("bn-sortrev",sortRev);buildSortbar();renderList();};bar.appendChild(r);
}
function renderList(){
  const S=SORTS[sortBy];
  let arr=WINES.slice().sort((a,b)=>cmp(S.key(a),S.key(b)));
  if(sortRev) arr.reverse();
  listOrder=arr.map(w=>w.id);
  $("sortnote").textContent=S.note;
  let html="", last=null;
  const counts={}; arr.forEach(w=>{const g=S.group(w);counts[g]=(counts[g]||0)+1;});
  arr.forEach(w=>{
    const g=S.group(w);
    if(g!==last){html+=`<div class="grp">${g}<small>${counts[g]} ${counts[g]===1?"יין":"יינות"}</small></div>`;last=g;}
    const grapes=w.blend.length?w.blend.slice(0,3).map(([x,p])=>`${p}% ${x}`).join(" · ")+(w.blend.length>3?" …":""):"זנים לא צוינו";
    html+=`<button class="wrow" data-id="${w.id}">
      <span class="thumb">${bottle(w)}</span>
      <span class="wmain"><span class="wname">${w.name} ${w.vintage}</span>
        <span class="wsub">${w.he?w.he+" · ":""}${w.kind}${w.series&&w.series!==w.kind?" · "+w.series:""}</span>
        <span class="wgr">${grapes}</span></span>
      <span class="wmet">${S.metric(w)}</span></button>`;
  });
  $("rows").innerHTML=html;
}

function setWineMode(m){
  $("wineMode").querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.mode===m));
  $("wineCards").classList.toggle("hidden",m!=="cards");
  if(m==="cards"){ $("wineList").classList.add("hidden"); $("wineDetail").classList.add("hidden"); }
  else { $("wineDetail").classList.add("hidden"); $("wineList").classList.remove("hidden"); }
  store.set("bn-winemode",m);
}
$("wineMode").addEventListener("click",e=>{const b=e.target.closest("button");if(b)setWineMode(b.dataset.mode);});

/* ---------- grapes ---------- */
const winesWith = g => WINES.filter(w=>w.blend.some(([x])=>x===g));
const winesLed = g => WINES.filter(w=>w.lead===g);
function grapeBody(g){
  const led=winesLed(g.n).map(label), all=winesWith(g.n).map(label).filter(x=>!led.includes(x));
  return `<p>${g.style}</p>
      <dl>
        <dt>ניחוחות</dt><dd><div class="tags">${g.aromas.map(a=>`<span class="tag">${a}</span>`).join("")}</div></dd>
        <dt>בבן נון</dt><dd>${g.here}</dd>
        ${led.length?`<dt>מוביל ב</dt><dd>${led.join(", ")}</dd>`:""}
        ${all.length?`<dt>נמצא גם ב</dt><dd>${all.join(", ")}</dd>`:""}
      </dl>
      <div class="tip">${g.fact}</div>`;
}
$("grapeList").innerHTML=GRAPES.map(g=>`<details class="grape"><summary><span class="dot" style="background:${g.c}"></span>
    <span><span class="gname">${g.n}</span><br><span class="gsub">${g.from}</span></span></summary>
    <div class="gbody">${grapeBody(g)}</div></details>`).join("");
function openGrape(name){
  const g=GRAPES.find(x=>x.n===name); if(!g) return;
  $("gdlgBody").innerHTML=`<div class="shead"><span class="dot" style="background:${g.c}"></span>
      <span><span class="gname" id="gdlgTitle">${g.n}</span><br><span class="gsub">${g.from}</span></span></div>
    ${grapeBody(g)}
    <div class="row"><button class="btn primary" id="gdlgClose">סגירה</button></div>`;
  const d=$("gdlg");
  $("gdlgClose").onclick=()=>d.close();
  if(d.showModal) d.showModal(); else d.setAttribute("open","");
  $("gdlgClose").focus();
}
$("gdlg").addEventListener("click",e=>{if(e.target===$("gdlg"))$("gdlg").close();});
$("quizGrapes").onclick=()=>{show("quiz");startQuiz("grapes");};

/* ---------- question builders ---------- */
const Q=(q,a,o,e,w)=>({q,a,o:shuffle([a,...shuffle(uniq(o).filter(x=>x!==a)).slice(0,3)]),e,w});
const ALCS=["12%","12.3%","12.5%","13%","13.5%","14%","19.5%"];
const LEADS=["קברנה סוביניון","מרלו","פטיט ורדו","סנג'ובזה","פטיט סירה","שרדונה","מרסלן","מלבק"];
const SERIES=["Reserve","Barrel Reserve","Kings Wine","Rose"];
const allTastes=uniq(WINES.flatMap(w=>w.tastes));

function wineQs(w){
  const qs=[], L=label(w), others=WINES.filter(x=>x!==w);
  const blends=uniq(others.map(blendText).filter(b=>b!==blendText(w)));
  qs.push(Q(`מה הבלנד של ${L}?`,blendText(w),shuffle(blends),`${L}: ${blendText(w)}.`,w));
  if(w.lead && w.blend.length>1) qs.push(Q(`מה הזן המוביל ב-${L}?`,w.lead,LEADS,`הבלנד: ${blendText(w)}.`,w));
  if(w.barrel){const bs=uniq(WINES.map(x=>x.barrel).filter(Boolean)); qs.push(Q(`כמה זמן ואיפה התיישן ${L}?`,w.barrel,shuffle(bs),`${L}: ${w.barrel}.`,w));}
  if(!dup(w)){const vs=uniq(WINES.map(x=>x.vintage)); qs.push(Q(`מה הבציר של ${L} שנמכר עכשיו?`,w.vintage,shuffle(vs),`${L} ${w.vintage}.`,w));}
  if(w.series && SERIES.includes(w.series)) qs.push(Q(`לאיזו סדרה שייך ${L}?`,w.series,SERIES,`${L} בסדרת ${w.series}.`,w));
  if(w.alc) qs.push(Q(`כמה אלכוהול יש ב-${L}?`,w.alc,ALCS,`${L}: ${w.alc} אלכוהול.`,w));
  if(w.serve){const ss=["8–10 מעלות","12 מעלות","16 מעלות","18 מעלות"]; qs.push(Q(`באיזו טמפרטורה מגישים את ${L}?`,w.serve,ss,`${L}: ${w.serve}.`,w));}
  if(typeof w.price==="number"){const ps=uniq(WINES.map(x=>x.price).filter(p=>typeof p==="number"&&p!==w.price)).sort(()=>Math.random()-.5).map(p=>p+" ₪"); qs.push(Q(`כמה עולה ${L}?`,w.price+" ₪",ps,`${L}: ${w.price} ₪.`,w));}
  if(w.tastes.length){
    const foreign=shuffle(allTastes.filter(t=>!w.tastes.includes(t)&&!w.tastes.some(x=>x.includes(t)||t.includes(x))));
    const right=shuffle(w.tastes)[0];
    qs.push(Q(`איזה מהטעמים האלה מופיע ב-${L}?`,right,foreign,`הטעמים של ${L}: ${w.tastes.join(", ")}.`,w));
    if(w.tastes.length>=3){
      const odd=foreign[0], mine=shuffle(w.tastes).slice(0,3);
      qs.push({q:`איזה טעם לא מופיע ב-${L}?`,a:odd,o:shuffle([odd,...mine]),e:`הטעמים של ${L}: ${w.tastes.join(", ")}.`,w});
    }
  }
  (w.extra||[]).forEach(x=>qs.push(Q(x.q,x.a,x.o,x.e||w.tip,w)));
  return qs;
}
function tasteQs(){
  const qs=[];
  WINES.filter(w=>w.tastes.length>=2).forEach(w=>{
    const L=label(w), t=shuffle(w.tastes).slice(0,2).join(" ו");
    const cands=WINES.filter(x=>x!==w && !w.tastes.slice(0,2).every(tt=>x.tastes.includes(tt))).map(label);
    qs.push(Q(`באיזה יין מרגישים ${t}?`,L,shuffle(uniq(cands)),`הטעמים של ${L}: ${w.tastes.join(", ")}.`,w));
  });
  return qs;
}
function grapeQs(){
  const qs=[];
  GRAPES.forEach(g=>{
    qs.push(Q(`מאיפה מגיע במקור הזן ${g.n}?`,g.from,GRAPES.map(x=>x.from),`${g.n}: ${g.from}.`));
    const foreign=uniq(GRAPES.filter(x=>x!==g).flatMap(x=>x.aromas).filter(a=>!g.aromas.includes(a)));
    qs.push(Q(`איזה ניחוח אופייני ל${g.n}?`,shuffle(g.aromas)[0],shuffle(foreign),`${g.n}: ${g.aromas.join(", ")}.`));
    const led=winesLed(g.n);
    if(led.length){const w=shuffle(led)[0]; const opts=WINES.filter(x=>x.lead!==g.n).map(label);
      qs.push(Q(`באיזה יין של בן נון ${g.n} הוא הזן המוביל?`,label(w),shuffle(uniq(opts)),`${g.n} מוביל ב: ${winesLed(g.n).map(label).join(", ")}.`));}
  });
  qs.push(Q("מרסלן הוא הכלאה של אילו זנים?","קברנה סוביניון וגרנאש",["קברנה סוביניון וגרנאש","מרלו וסירה","פינו נואר וגאמה","סנג'ובזה ומרלו"],"מרסלן נוצר בצרפת ב-1961."));
  qs.push(Q("מה השם הצרפתי של פטיט סירה?","דוריף",["דוריף","סירה","גרנאש","קריניאן"],"פטיט סירה הוא הכלאה של סירה ופלורסן."));
  qs.push(Q("איזה זן הוא אחד ההורים של קברנה סוביניון?","קברנה פרנק",["קברנה פרנק","מרלו","פטיט ורדו","מלבק"],"ההורה השני הוא סוביניון בלאן."));
  qs.push(Q("מה פירוש \"גוורץ\" בגרמנית?","תבלין",["תבלין","ורד","זהב","לבן"],"גוורצטרמינר ידוע בניחוחות ליצ'י וורדים."));
  qs.push(Q("באיזו מדינה גדל היום רוב המלבק בעולם?","ארגנטינה",["ארגנטינה","צרפת","איטליה","ספרד"],"בעיקר באזור מנדוסה."));
  qs.push(Q("מאיזו מדינה מגיע הסנג'ובזה?","איטליה",["איטליה","צרפת","ספרד","פורטוגל"],"הזן של הקיאנטי בטוסקנה."));
  return qs;
}
function historyQs(){return HISTORY_Q.map(x=>Q(x.q,x.a,x.o,x.e));}

/* ---------- quiz engine ---------- */
const quiz={list:[],i:0,score:0,mode:"",wrong:[]};
function quizMenu(){
  const opts=WINES.map(w=>`<option value="${w.id}">${label(w)}${dup(w)?"":" "+w.vintage}</option>`).join("");
  const best=store.get("bn-best2",{});
  const b=k=>best[k]!=null?` · שיא: ${best[k]}%`:"";
  $("quizBox").innerHTML=`<h2 class="sec">איזה חידון?</h2><p class="lead">10 שאלות בכל סבב, עם הסבר אחרי כל תשובה.</p>
    <div class="modes">
      <button class="mode" data-m="mix"><b>חידון כללי</b><span>יינות, טעמים, ענבים והיקב${b("mix")}</span></button>
      <div class="mode" style="cursor:default"><b>בקבוק אחד</b><span>כל השאלות על בקבוק שתבחרו: בלנד, חבית, טעמים ועוד</span>
        <select id="pickWine" aria-label="בחירת בקבוק">${opts}</select>
        <div class="row" style="margin-top:10px"><button class="btn primary" id="goWine">התחל</button></div></div>
      <button class="mode" data-m="tastes"><b>טעמים</b><span>איזה טעם שייך לאיזה יין${b("tastes")}</span></button>
      <button class="mode" data-m="grapes"><b>ענבים</b><span>מאיפה כל זן, מה מרגישים בו ואיפה הוא אצלנו${b("grapes")}</span></button>
      <button class="mode" data-m="story"><b>היקב</b><span>היסטוריה, צוות, כרם וייצור${b("story")}</span></button>
    </div>`;
  $("quizBox").querySelectorAll("button.mode").forEach(el=>el.onclick=()=>startQuiz(el.dataset.m));
  $("goWine").onclick=()=>startQuiz("wine",$("pickWine").value);
}
function startQuiz(mode,wineId){
  let pool;
  if(mode==="wine"){const w=WINES.find(x=>x.id===wineId); pool=shuffle(wineQs(w)); quiz.title=label(w)+" "+(dup(w)?"":w.vintage);}
  else if(mode==="tastes"){pool=shuffle(tasteQs().concat(WINES.flatMap(wineQs).filter(q=>q.q.includes("טעם")))); quiz.title="טעמים";}
  else if(mode==="grapes"){pool=shuffle(grapeQs()); quiz.title="ענבים";}
  else if(mode==="story"){pool=shuffle(historyQs()); quiz.title="היקב";}
  else {pool=shuffle(WINES.flatMap(wineQs)).slice(0,5).concat(shuffle(tasteQs()).slice(0,1),shuffle(grapeQs()).slice(0,2),shuffle(historyQs()).slice(0,2)); pool=shuffle(pool); quiz.title="חידון כללי";}
  quiz.list=pool.slice(0,10); quiz.i=0; quiz.score=0; quiz.mode=mode; quiz.wineId=wineId; quiz.wrong=[];
  showQ();
}
function showQ(){
  const q=quiz.list[quiz.i];
  $("quizBox").innerHTML=`<div class="qnum"><span>${quiz.title}</span><span>שאלה ${quiz.i+1} מתוך ${quiz.list.length}</span></div>
    ${quiz.mode==="wine"&&q.w?`<div class="qimg">${bottle(q.w)}</div>`:""}
    <div class="qtext">${q.q}</div><div class="opts"></div><div class="explain hidden"></div>
    <div class="row hidden" id="nextRow"><button class="btn primary" id="qNext">${quiz.i+1<quiz.list.length?"לשאלה הבאה":"לתוצאה"}</button></div>`;
  const box=$("quizBox").querySelector(".opts");
  q.o.forEach(o=>{const b=document.createElement("button");b.className="opt";b.textContent=o;b.onclick=()=>answer(b,o,q);box.appendChild(b);});
  $("qNext").onclick=()=>{quiz.i++; quiz.i<quiz.list.length?showQ():endQuiz();};
}
function answer(btn,o,q){
  const box=$("quizBox");
  box.querySelectorAll(".opt").forEach(b=>{b.disabled=true;if(b.textContent===q.a)b.classList.add("right");});
  if(o===q.a) quiz.score++; else {btn.classList.add("wrong"); quiz.wrong.push(q);}
  const ex=box.querySelector(".explain"); ex.textContent=(o===q.a?"נכון. ":"התשובה: "+q.a+". ")+(q.e||""); ex.classList.remove("hidden");
  $("nextRow").classList.remove("hidden"); $("qNext").focus();
}
function endQuiz(){
  const pct=Math.round(quiz.score/quiz.list.length*100);
  if(quiz.mode!=="wine"){const best=store.get("bn-best2",{}); best[quiz.mode]=Math.max(best[quiz.mode]||0,pct); store.set("bn-best2",best);}
  const msg=pct>=90?"אפשר לעמוד מאחורי הבר.":pct>=60?"כמעט שם. עוד סבב ותהיו מוכנים.":"שווה לחזור לכרטיסיות ולנסות שוב.";
  $("quizBox").innerHTML=`<div class="qnum"><span>${quiz.title}</span><span>התוצאה</span></div>
    <div class="score">${quiz.score}/${quiz.list.length}</div><p style="text-align:center;margin:0">${msg}</p>
    ${quiz.wrong.length?`<div class="review"><b>לחזור על:</b><ul>${quiz.wrong.map(q=>`<li>${q.q} <b>${q.a}</b></li>`).join("")}</ul></div>`:""}
    <div class="row"><button class="btn primary" id="again2">סבב נוסף</button><button class="btn" id="menu2">חידון אחר</button></div>`;
  $("again2").onclick=()=>startQuiz(quiz.mode,quiz.wineId);
  $("menu2").onclick=quizMenu;
}

      <li><b>960 לפנה"ס</b>גת לדריכת ענבים מתקופת בית ראשון</li>
